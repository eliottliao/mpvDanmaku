name: Preview Build & Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit_count: ${{ steps.set_commit.outputs.commit_count }}
      build_time: ${{ steps.set_commit.outputs.build_time }}
      universal_size: ${{ steps.set_commit.outputs.universal_size }}
      arm64-v8a_size: ${{ steps.set_commit.outputs.arm64-v8a_size }}
      armeabi-v7a_size: ${{ steps.set_commit.outputs.armeabi-v7a_size }}
      x86_size: ${{ steps.set_commit.outputs.x86_size }}
      x86_64_size: ${{ steps.set_commit.outputs.x86_64_size }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assembleStandardPreview
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}

      - name: Sign APKs
        run: |
          set -euo pipefail
          PREVIEW_DIR="app/build/outputs/apk/standard/preview"
          
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "apksigner not found or not executable at $APKSIGNER"
            exit 1
          fi
          
          echo "${{ secrets.MPVDANMAKU_SIGNING_KEYSTORE }}" | base64 -d > release.keystore
          trap 'rm -f release.keystore' EXIT

          sign_apk() {
            local apk="$1"
            local signed_apk="${apk/-unsigned/}"
            echo "Signing $apk -> $signed_apk"
            
            "$APKSIGNER" sign \
              --ks release.keystore \
              --ks-key-alias "${{ secrets.MPVDANMAKU_SIGNING_KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.MPVDANMAKU_SIGNING_STORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.MPVDANMAKU_KEY_PASSWORD }}" \
              --out "$signed_apk" \
              "$apk"
            
            "$APKSIGNER" verify "$signed_apk"
            rm "$apk"
          }
          
          preview_apks=("$PREVIEW_DIR"/app-standard-*-preview-unsigned.apk)
          if [ ! -e "${preview_apks[0]}" ]; then
            echo "No unsigned preview APK files found"
            ls -lah "$PREVIEW_DIR"
            rm -f release.keystore
            exit 1
          fi
          
          for apk in "${preview_apks[@]}"; do
            sign_apk "$apk"
          done
          
          rm -f release.keystore
          ls -lh "$PREVIEW_DIR"/app-standard-*-preview.apk

      - name: Copy build artifacts
        id: set_commit
        run: |
          set -euo pipefail
          commit_count=$(git rev-list --count HEAD)
          build_time=$(date -u +"%Y-%m-%d %H:%M UTC")
          echo "commit_count=$commit_count" >> $GITHUB_OUTPUT
          echo "build_time=$build_time" >> $GITHUB_OUTPUT

          declare -a apks=("universal" "arm64-v8a" "armeabi-v7a" "x86" "x86_64")
          mkdir -p output
          
          for arch in "${apks[@]}"; do
            src="app/build/outputs/apk/standard/preview/app-standard-${arch}-preview.apk"
            dest="output/mpvDanmaku-preview-r${commit_count}-${arch}.apk"
            if [ ! -f "$src" ]; then
              echo "::error file=$src::Signed preview APK for $arch was not found"
              exit 1
            fi
            cp "$src" "$dest"
          
            # Get file size in human-readable format
            size=$(du -h "$dest" | cut -f1)
            echo "${arch}_size=$size" >> $GITHUB_OUTPUT
          done

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-apks
          path: output/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: preview-apks
          path: ./public

      - name: Generate download page
        run: |
          commit_count=${{ needs.build.outputs.commit_count }}
          build_time="${{ needs.build.outputs.build_time }}"
          echo "<!DOCTYPE html>
          <html lang='en'>
          <head>
            <meta charset='UTF-8'>
            <meta name='viewport' content='width=device-width, initial-scale=1.0'>
            <title>mpvDanmaku Preview Builds</title>
            <style>
              body { font-family: sans-serif; padding: 2em; background: #0d1117; color: #c9d1d9; }
              h1 { color: #58a6ff; }
              a { color: #58a6ff; text-decoration: none; display: block; margin: 8px 0; }
              a:hover { text-decoration: underline; }
              .note { color: #8b949e; font-size: 0.9em; margin-top: 1em; }
              .filesize { color: #8b949e; font-size: 0.9em; }
            </style>
          </head>
          <body>
            <h1>mpvDanmaku Preview Build r${commit_count}</h1>
            <p>Build time: ${build_time}</p>
            <p>Download the latest signed APKs:</p>
            <ul>
              <li><a href='mpvDanmaku-preview-r${commit_count}-universal.apk'>Universal (${{ needs.build.outputs.universal_size }})</a></li>
              <li><a href='mpvDanmaku-preview-r${commit_count}-arm64-v8a.apk'>arm64-v8a (${{ needs.build.outputs.arm64-v8a_size }})</a></li>
              <li><a href='mpvDanmaku-preview-r${commit_count}-armeabi-v7a.apk'>armeabi-v7a (${{ needs.build.outputs.armeabi-v7a_size }})</a></li>
              <li><a href='mpvDanmaku-preview-r${commit_count}-x86.apk'>x86 (${{ needs.build.outputs.x86_size }})</a></li>
              <li><a href='mpvDanmaku-preview-r${commit_count}-x86_64.apk'>x86_64 (${{ needs.build.outputs.x86_64_size }})</a></li>
            </ul>
            <p class='note'>Built automatically from the <code>${{ github.ref_name }}</code> branch.</p>
          </body>
          </html>" > ./public/index.html

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
