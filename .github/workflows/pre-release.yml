name: Make Pre release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-preview.[0-9]+'

jobs:
  release-for-github:
    name: "Preview Release for GitHub"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 17
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build preview APKs
        run: ./gradlew assembleStandardPreview --stacktrace
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}

      - name: Get tag name
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "VERSION_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Verify build output
        run: |
          PREVIEW_DIR="app/build/outputs/apk/standard/preview"
          if [ ! -d "$PREVIEW_DIR" ]; then
            echo "Preview directory does not exist!"
            find app/build/outputs -name "*.apk" -type f
            exit 1
          fi
          ls -lah "$PREVIEW_DIR"

      - name: Sign APKs
        run: |
          set -euo pipefail
          PREVIEW_DIR="app/build/outputs/apk/standard/preview"
          
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "apksigner not found or not executable at $APKSIGNER"
            exit 1
          fi
          
          echo "${{ secrets.MPVDANMAKU_SIGNING_KEYSTORE }}" | base64 -d > release.keystore
          
          sign_apk() {
            local apk="$1"
            local signed_apk="${apk/-unsigned/}"
            echo "Signing $apk -> $signed_apk"
            
            "$APKSIGNER" sign \
              --ks release.keystore \
              --ks-key-alias "${{ secrets.MPVDANMAKU_SIGNING_KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.MPVDANMAKU_SIGNING_STORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.MPVDANMAKU_KEY_PASSWORD }}" \
              --out "$signed_apk" \
              "$apk"
            
            "$APKSIGNER" verify "$signed_apk"
            rm "$apk"
          }
          
          preview_apks=("$PREVIEW_DIR"/app-standard-*-preview-unsigned.apk)
          if [ ! -e "${preview_apks[0]}" ]; then
            echo "No unsigned preview APK files found"
            ls -lah "$PREVIEW_DIR"
            rm -f release.keystore
            exit 1
          fi
          
          for apk in "${preview_apks[@]}"; do
            sign_apk "$apk"
          done
          
          rm -f release.keystore
          ls -lh "$PREVIEW_DIR"/app-standard-*-preview.apk

      - name: Copy built artifacts
        run: |
          set -euo pipefail
          mkdir -p preview
          declare -a apks=("universal" "arm64-v8a" "armeabi-v7a" "x86" "x86_64")

          for abi in "${apks[@]}"; do
            src="app/build/outputs/apk/standard/preview/app-standard-${abi}-preview.apk"
            dest="preview/mpvDanmaku-preview-${abi}-${VERSION_TAG}.apk"
            if [ ! -f "$src" ]; then
              echo "::error file=$src::Signed preview APK for $abi was not found"
              exit 1
            fi
            cp "$src" "$dest"
            sha=$(sha256sum "$dest" | awk '{ print $1 }')
            varname="apk_${abi//-/_}_sha256"
            echo "$varname=$sha" >> "$GITHUB_ENV"
          done

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "mpvDanmaku ${{ env.VERSION_TAG }}"
          body: |
            
            ### Checksums
            | Variant | SHA-256 |
            | ------- | ------- |
            | arm64-v8a | ${{ env.apk_arm64_v8a_sha256 }} |
            | armeabi-v7a | ${{ env.apk_armeabi_v7a_sha256 }} |
            | Universal | ${{ env.apk_universal_sha256 }} |
            | x86 | ${{ env.apk_x86_sha256 }} |
            | x86_64 | ${{ env.apk_x86_64_sha256 }} |
          files: |
            preview/mpvDanmaku-preview-universal-${{ env.VERSION_TAG }}.apk
            preview/mpvDanmaku-preview-arm64-v8a-${{ env.VERSION_TAG }}.apk
            preview/mpvDanmaku-preview-armeabi-v7a-${{ env.VERSION_TAG }}.apk
            preview/mpvDanmaku-preview-x86-${{ env.VERSION_TAG }}.apk
            preview/mpvDanmaku-preview-x86_64-${{ env.VERSION_TAG }}.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
